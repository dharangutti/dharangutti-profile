<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technology Horizons 2026–2051 — Anup Dharangutti</title>
  <meta name="description" content="Explore technology forecasts for 2031, 2041, 2046, and 2051 and follow their revisions over time.">
  <link rel="canonical" href="https://www.dharangutti.in/technology-horizons.html">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="assets/css/technology-horizons.css">
  <link rel="stylesheet" href="assets/css/forecast-stats.css">
  <script defer src="/include-header.js"></script>
  <script defer src="/breadcrumb.js"></script>
  <script type="module" src="assets/js/technology-horizons.js"></script>
  <script type="module" src="assets/js/forecast-stats.js"></script>
</head>
<body>
  <main class="horizons">
    <header class="horizons-intro">
      <h1>Technology Horizons 2026–2051</h1>
      <p>Explore forecasts by target year and follow how they change over time.</p>
    </header>
    <section aria-labelledby="forecast-stats-title">
      <h2 id="forecast-stats-title">Forecast statistics</h2>
      <div data-forecast-stats role="status"></div>
    </section>
    <p id="forecast-status" role="status">Loading forecasts…</p>
    <section id="forecast-controls" class="forecast-controls" aria-label="Forecast filters" hidden>
      <label>Category <select id="forecast-category"><option value="">All categories</option></select></label>
      <label>Search <input id="forecast-search" type="search" placeholder="Search forecasts"></label>
    </section>
    <noscript><p>Enable JavaScript to explore forecasts and respond to polls.</p></noscript>
    <section id="forecasts-2031" aria-labelledby="horizon-2031"><h2 id="horizon-2031">2031</h2><div></div></section>
    <section id="forecasts-2041" aria-labelledby="horizon-2041"><h2 id="horizon-2041">2041</h2><div></div></section>
    <section id="forecasts-2046" aria-labelledby="horizon-2046"><h2 id="horizon-2046">2046</h2><div></div></section>
    <section id="forecasts-2051" aria-labelledby="horizon-2051"><h2 id="horizon-2051">2051</h2><div></div></section>
  </main>
</body>
</html>
